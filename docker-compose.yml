services:
  db:
    image: postgres:15-alpine
    container_name: fraudshield-db
    restart: always
    environment:
      POSTGRES_DB: fraudshield
      POSTGRES_USER: fraudshield_user
      POSTGRES_PASSWORD: fraudshield_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield_user -d fraudshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fraudshield-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fraudshield_user:fraudshield_password@db:5432/fraudshield
      SECRET_KEY: django-insecure-fraudshield-production-key-seed-xyz-12345
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend,web
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
      ML_MODEL_PATH: /app/ml/fraud_xgb_model.pkl
      ML_SCALER_PATH: /app/ml/scaler.pkl
      ML_THRESHOLD_PATH: /app/ml/threshold.txt
      ML_REPORT_PATH: /app/ml/model_report.json
      ML_TEST_SAMPLE_PATH: /app/ml/data/test_sample.csv
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/backend/media

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fraudshield-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fraudshield-simulator
    restart: always
    depends_on:
      - backend
    environment:
      DATABASE_URL: postgres://fraudshield_user:fraudshield_password@db:5432/fraudshield
      SECRET_KEY: django-insecure-fraudshield-production-key-seed-xyz-12345
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend,web
      ML_MODEL_PATH: /app/ml/fraud_xgb_model.pkl
      ML_SCALER_PATH: /app/ml/scaler.pkl
      ML_THRESHOLD_PATH: /app/ml/threshold.txt
      ML_REPORT_PATH: /app/ml/model_report.json
      ML_TEST_SAMPLE_PATH: /app/ml/data/test_sample.csv
    command: ["python", "manage.py", "run_simulator", "--interval", "3"]

volumes:
  postgres_data:
  media_data:
